# ViewSonic PJD7820HD - transparent RS-232 <-> TCP bridge.
#
# This node no longer knows anything about the projector protocol. It just
# hands the serial line to the network; the viewsonic_projector custom
# integration in Home Assistant does the talking.
#
# HARDWARE: the projector's DB9 is true RS-232 (+/-12V). A MAX3232-class
# level shifter between it and the ESP8266 is mandatory. TX->RX, RX->TX, GND-GND.
#
# NOTE ON ENTITY IDs: the node name and the three diagnostic entity names are
# unchanged, so sensor.projector_controller_wifi_signal,
# sensor.projector_controller_ip_address and button.restart_projector_controller
# all survive. The old switch.projector_power and
# binary_sensor.projector_power_status DO disappear -- the integration owns
# those now. Fix up automations before flashing this.

esphome:
  name: viewsonic_projector

esp8266:
  board: nodemcuv2

# Third-party component, vendored locally rather than pulled from GitHub.
#
# Upstream (github://oxan/esphome-stream-server) does not compile on ESPHome
# 2026.8: it calls esphome::network::get_use_address(), which no longer exists.
# The local copy carries a one-line patch to a diagnostic log statement; see the
# comment in components/stream_server/stream_server.cpp.
#
# Copy the components/ directory next to this file, so the tree is:
#   /config/esphome/projector.yaml
#   /config/esphome/components/stream_server/
external_components:
  - source:
      type: local
      path: components
    components: [stream_server]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none      # ESP8266 modem sleep drops idle TCP connections
  fast_connect: true
  ap:
    ssid: "Projector Fallback Hotspot"
    password: !secret projector_ap_password

captive_portal:

logger:
  baud_rate: 0               # UART0 belongs to the projector; logs go over WiFi

api:
  encryption:
    key: !secret projector_api_key
  # A reboot drops the integration's socket for ~20s. Don't reboot just
  # because Home Assistant restarted.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret projector_ota_password

uart:
  id: uart_bus
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

stream_server:
  uart_id: uart_bus
  port: 8888

binary_sensor:
  # Tells you whether Home Assistant currently holds the socket open.
  - platform: stream_server
    connected:
      name: "Projector Bridge Connected"
      entity_category: diagnostic

sensor:
  # UNCHANGED NAME -> stays sensor.projector_controller_wifi_signal
  - platform: wifi_signal
    name: "Projector Controller WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Projector Controller Uptime"
    entity_category: diagnostic

text_sensor:
  # UNCHANGED NAME -> stays sensor.projector_controller_ip_address
  - platform: wifi_info
    ip_address:
      name: "Projector Controller IP Address"
      entity_category: diagnostic

button:
  # UNCHANGED NAME -> stays button.restart_projector_controller
  - platform: restart
    name: "Restart Projector Controller"
    entity_category: diagnostic
